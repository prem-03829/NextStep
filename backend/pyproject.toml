[project]
name = "nextstep-scraper"
version = "0.1.0"
description = "High-performance college data scraper for NextStep"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "supabase>=2.3.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
